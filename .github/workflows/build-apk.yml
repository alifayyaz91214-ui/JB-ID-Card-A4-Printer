name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Remove old APK artifacts (keep latest two)
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'JB-ID-Card-A4-Printer-signed-release';
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const apkArtifacts = artifacts.filter(a => a.name === name)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            core.info(`Found ${apkArtifacts.length} signed APK artifacts; keeping the newest two.`);
            for (const artifact of apkArtifacts.slice(2)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted old APK artifact ${artifact.id}`);
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.JB_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JB_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing is not configured. Set JB_KEYSTORE_BASE64, JB_KEYSTORE_PASSWORD, JB_KEY_ALIAS, and JB_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jb-release.jks"
          test -s "$RUNNER_TEMP/jb-release.jks"
          echo "JB_KEYSTORE_PATH=$RUNNER_TEMP/jb-release.jks" >> "$GITHUB_ENV"
          echo "JB_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JB_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "JB_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build consistently signed release APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify signed APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: JB-ID-Card-A4-Printer-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
